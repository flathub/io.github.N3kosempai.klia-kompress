app-id: io.github.N3kosempai.klia-kompress
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: klia-kompress
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: klia-kompress
    buildsystem: simple
    build-commands:
      - install -Dm755 klia-kompress /app/bin/klia-kompress
      - install -Dm644 share/applications/io.github.N3kosempai.klia-kompress.desktop /app/share/applications/io.github.N3kosempai.klia-kompress.desktop
      - install -Dm644 share/metainfo/io.github.N3kosempai.klia-kompress.metainfo.xml /app/share/metainfo/io.github.N3kosempai.klia-kompress.metainfo.xml
      - install -Dm644 share/icons/hicolor/512x512/apps/io.github.N3kosempai.klia-kompress.png /app/share/icons/hicolor/512x512/apps/io.github.N3kosempai.klia-kompress.png
    sources:
      - type: archive
        url: https://github.com/N3koSempai/klia-kompress/releases/download/v2.4.0/klia-kompress-2.4.0-x86_64.tar.gz
        sha256: f25ec1850d01b5d82c9341cedb2ae04eba6bbbb0ea9b8c75c587234b390e4605
